version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: trading-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: trading-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  risk-sidecar:
    build:
      context: .
      dockerfile: risk-sidecar/Dockerfile
    container_name: risk-sidecar
    ports:
      - "50051:50051"
    environment:
      RISK_SIDECAR_HOST: 0.0.0.0
      RISK_SIDECAR_PORT: 50051

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: trading-orchestrator
    depends_on:
      - kafka
      - risk-sidecar
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RISK_GRPC_HOST: risk-sidecar
      RISK_GRPC_PORT: 50051
      RISK_THRESHOLD_PRICE: 150.0
