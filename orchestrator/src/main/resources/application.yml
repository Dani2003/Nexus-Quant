server:
  port: ${PORT:8080}

spring:
  application:
    name: orchestrator
  threads:
    virtual:
      enabled: true # Enable Java 21 Project Loom Virtual Threads across Spring framework
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:file:./data/nexus_quant_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:trading-orchestrator-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        enable.idempotence: false

trading:
  kafka:
    market-ticks-topic: ${KAFKA_MARKET_TICKS_TOPIC:market-ticks}
    trade-orders-topic: ${KAFKA_TRADE_ORDERS_TOPIC:trade-orders}
    trade-executions-topic: ${KAFKA_TRADE_EXECUTIONS_TOPIC:trade-executions}
    risk-rejections-topic: ${KAFKA_RISK_REJECTIONS_TOPIC:risk-rejections}
    publish-timeout-ms: ${KAFKA_PUBLISH_TIMEOUT_MS:3000}
    concurrency: ${KAFKA_CONCURRENCY:4}
  risk:
    grpc-host: ${RISK_GRPC_HOST:localhost}
    grpc-port: ${RISK_GRPC_PORT:50051}
    # Threshold condition: evaluate risk whenever tick price reaches or exceeds this price
    threshold-price: ${RISK_THRESHOLD_PRICE:150.0}
    default-proposed-trade-size: ${RISK_DEFAULT_TRADE_SIZE:100.0}
    grpc-deadline-ms: ${RISK_GRPC_DEADLINE_MS:50}
    max-concurrent-evaluations: ${RISK_MAX_CONCURRENT_EVALUATIONS:50}
    concurrency-timeout-ms: ${RISK_CONCURRENCY_TIMEOUT_MS:25}
