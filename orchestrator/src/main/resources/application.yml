server:
  port: ${PORT:8080}

spring:
  application:
    name: orchestrator
  threads:
    virtual:
      enabled: true # Enable Java 21 Project Loom Virtual Threads across Spring framework
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:trading-orchestrator-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        enable.idempotence: false

trading:
  kafka:
    market-ticks-topic: ${KAFKA_MARKET_TICKS_TOPIC:market-ticks}
    trade-orders-topic: ${KAFKA_TRADE_ORDERS_TOPIC:trade-orders}
    risk-rejections-topic: ${KAFKA_RISK_REJECTIONS_TOPIC:risk-rejections}
    concurrency: ${KAFKA_CONCURRENCY:4}
  risk:
    grpc-host: ${RISK_GRPC_HOST:localhost}
    grpc-port: ${RISK_GRPC_PORT:50051}
    # Threshold condition: evaluate risk whenever tick price reaches or exceeds this price
    threshold-price: ${RISK_THRESHOLD_PRICE:150.0}
    default-proposed-trade-size: ${RISK_DEFAULT_TRADE_SIZE:100.0}
    grpc-deadline-ms: ${RISK_GRPC_DEADLINE_MS:50}
